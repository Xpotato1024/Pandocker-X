name: Preview portable packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: pdx.exe
            source: --source-asset
            archive: windows-x86_64-msvc.zip
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: pdx
            source: ''
            archive: linux-x86_64-gnu.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: '1.99.0'
          targets: ${{ matrix.target }}
          components: rust-docs
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Isolated package roots
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'pdx-preview'
          @("CARGO_TARGET_DIR=$root/target", "PACKAGE_ROOT=$root/package", "SMOKE_ROOT=$root/smoke", 'CARGO_BUILD_JOBS=2', 'PYTHONDONTWRITEBYTECODE=1') | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - run: cargo fetch --locked
      - name: Package committed source, licenses and checksums
        shell: pwsh
        run: python -B packaging/preview.py --target '${{ matrix.target }}' --output "$env:PACKAGE_ROOT" ${{ matrix.source }}
      - name: Extract and run without Rust on PATH
        shell: pwsh
        run: python -B packaging/smoke.py "$env:PACKAGE_ROOT/assets/pandocker-x-v3.0.0-preview.1-${{ matrix.archive }}" --output "$env:SMOKE_ROOT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-${{ matrix.target }}
          path: ${{ env.PACKAGE_ROOT }}/assets/*
          if-no-files-found: error
          compression-level: 0
