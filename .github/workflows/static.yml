name: R1 static validation
on:
  pull_request:
  push:
    branches: [master, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: "1.99.0"
          components: rustfmt, clippy
      - name: Prepare isolated test root
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'pdx-r1'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          @(
            "CARGO_TARGET_DIR=$root/target"
            "CARGO_HOME=$root/cargo"
            "PDX_TEST_TEMP=$root"
            "TEMP=$root"
            "TMP=$root"
            "TMPDIR=$root"
            'CARGO_BUILD_JOBS=2'
            'RUST_TEST_THREADS=1'
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: cargo fmt --all --check
      - run: cargo check --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Unit, contracts, CLI, architecture and canonical documentation
        run: cargo test --workspace --all-targets --locked
